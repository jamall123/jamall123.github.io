<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سودان فري - إعادة تعيين كلمة المرور</title>
    
    <!-- Firebase SDK (Version 8 for simplicity in vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background-color: #0d9488;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }
        h2 {
            margin-top: 0;
            color: #111827;
        }
        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0f766e;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        .error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            display: block;
        }
        .success {
            background-color: #d1fae5;
            color: #047857;
            border: 1px solid #34d399;
            display: block;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🤝</div>
    <h2>تغيير كلمة المرور</h2>
    <p>أدخل كلمة المرور الجديدة لحسابك في سودان فري</p>

    <div id="form-container">
        <input type="password" id="new-password" placeholder="كلمة المرور الجديدة" minlength="6" required>
        <input type="password" id="confirm-password" placeholder="تأكيد كلمة المرور" minlength="6" required>
        
        <button id="submit-btn" onclick="handleResetPassword()">
            <span id="btn-text">حفظ كلمة المرور</span>
            <div id="btn-loader" class="loader"></div>
        </button>
    </div>

    <div id="status-message" class="message"></div>
</div>

<script>
    // 1. إعدادات Firebase الخاصة بتطبيقك
    const firebaseConfig = {
        apiKey: "AIzaSyCGdUP0ZJhFlXfmTSP4S-AvM5WMCOdih4A",
        authDomain: "sudanfree-d04fc.firebaseapp.com",
        projectId: "sudanfree-d04fc",
        storageBucket: "sudanfree-d04fc.firebasestorage.app"
    };

    // 2. تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 3. استخراج كود (oobCode) من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const actionCode = urlParams.get('oobCode');

    const statusMessage = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoader = document.getElementById('btn-loader');
    const formContainer = document.getElementById('form-container');

    // التأكد من وجود الكود في الرابط
    if (!actionCode) {
        showError("عذراً، الرابط غير صالح أو مفقود. يرجى طلب رابط جديد من التطبيق.");
        formContainer.style.display = 'none';
    }

    // 4. دالة تغيير كلمة المرور
    function handleResetPassword() {
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // التحقق من المدخلات
        if (newPassword.length < 6) {
            showError("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
            return;
        }
        if (newPassword !== confirmPassword) {
            showError("كلمتا المرور غير متطابقتين.");
            return;
        }

        // بدء التحميل
        setLoading(true);

        // إرسال الطلب لفايربيس
        auth.confirmPasswordReset(actionCode, newPassword).then((resp) => {
            // نجاح
            setLoading(false);
            showSuccess("تم تغيير كلمة المرور بنجاح! 🎉 يمكنك الآن العودة للتطبيق وتسجيل الدخول.");
            formContainer.style.display = 'none';
        }).catch((error) => {
            // فشل
            setLoading(false);
            let errorMessage = "حدث خطأ غير معروف.";
            
            if (error.code === 'auth/expired-action-code') {
                errorMessage = "عذراً، هذا الرابط منتهي الصلاحية أو تم استخدامه مسبقاً. يرجى طلب رابط جديد.";
            } else if (error.code === 'auth/invalid-action-code') {
                errorMessage = "الرابط غير صالح. يرجى التأكد من نسخ الرابط كاملاً.";
            } else if (error.code === 'auth/weak-password') {
                errorMessage = "كلمة المرور ضعيفة جداً.";
            }

            showError(errorMessage);
        });
    }

    // دوال مساعدة للواجهة
    function showError(msg) {
        statusMessage.textContent = msg;
        statusMessage.className = 'message error';
    }

    function showSuccess(msg) {
        statusMessage.textContent = msg;
        statusMessage.className = 'message success';
    }

    function setLoading(isLoading) {
        if (isLoading) {
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
        } else {
            submitBtn.disabled = false;
            btnText.style.display = 'block';
            btnLoader.style.display = 'none';
        }
    }
</script>

</body>
</html>
